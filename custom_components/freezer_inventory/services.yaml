add_item:
  name: Add item
  description: Add an item to the freezer (increases quantity if it already exists).
  fields:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    quantity:
      name: Quantity
      description: How many to add.
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    unit:
      name: Unit
      description: Unit of the contents, e.g. pcs, g, portions (or bags when no package size is set).
      example: pcs
      selector:
        text:
    package_size:
      name: Contents per package
      description: How much is in each package (in the unit above). Enables partial use with the use_amount service.
      example: 10
      selector:
        number:
          min: 0.01
          max: 100000
          step: any
          mode: box
    best_before:
      name: Best before
      description: Optional best-before date.
      selector:
        date:
remove_item:
  name: Remove item
  description: Remove a quantity of an item from the freezer.
  fields:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    quantity:
      name: Quantity
      description: How many to remove. Omit to remove the whole item.
      selector:
        number:
          min: 1
          max: 1000
          mode: box
set_quantity:
  name: Set quantity
  description: Set the quantity of an existing item (0 removes it).
  fields:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    quantity:
      name: Quantity
      description: The new quantity.
      required: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
use_amount:
  name: Use amount
  description: Use part of an item's contents without removing a whole package. When the open package is used up, the next one is opened.
  fields:
    name:
      name: Name
      description: Name of the item (must have a package size).
      required: true
      example: Minced beef
      selector:
        text:
    amount:
      name: Amount
      description: How much to use, in the item's unit.
      required: true
      example: 5
      selector:
        number:
          min: 0.01
          max: 100000
          step: any
          mode: box
clear:
  name: Clear
  description: Remove everything from the freezer inventory.
