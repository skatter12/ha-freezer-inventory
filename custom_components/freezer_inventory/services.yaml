add_item:
  name: Add item
  description: Add packages of an item. The same name with a different best-before date is stored as a separate batch.
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    quantity:
      name: Quantity
      description: Number of packages to add.
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    package_size:
      name: Per package
      description: How many units are in each package.
      example: 4
      selector:
        number:
          min: 0.01
          max: 100000
          step: any
          mode: box
    best_before:
      name: Best before
      description: Optional best-before date. A new date creates a new batch.
      selector:
        date:
remove_item:
  name: Remove item
  description: Remove packages of an item.
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    id:
      name: Batch ID
      description: Optional batch id (see the sensor attributes). Without it the batch with the oldest best-before date is used.
      selector:
        text:
    quantity:
      name: Quantity
      description: Number of packages to remove. Omit to remove the whole batch.
      selector:
        number:
          min: 1
          max: 1000
          mode: box
set_quantity:
  name: Set quantity
  description: Set the number of packages of a batch (0 removes it).
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    id:
      name: Batch ID
      description: Optional batch id. Without it the batch with the oldest best-before date is used.
      selector:
        text:
    quantity:
      name: Quantity
      description: The new number of packages.
      required: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
set_units:
  name: Set units
  description: Set the total units of a batch with a package size. Packages are recalculated, the last one may be partly full.
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    id:
      name: Batch ID
      description: Optional batch id. Without it the batch with the oldest best-before date is used.
      selector:
        text:
    units:
      name: Units
      description: Total units (0 removes the batch).
      required: true
      example: 6
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
use_amount:
  name: Use amount
  description: Use part of an item's contents without removing a whole package. When the open package is used up, the next one is opened. Without a batch id, the oldest best-before batch is used first.
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
    name:
      name: Name
      description: Name of the item (must have a package size).
      required: true
      example: Minced beef
      selector:
        text:
    id:
      name: Batch ID
      description: Optional batch id.
      selector:
        text:
    amount:
      name: Amount
      description: How many units to use.
      required: true
      example: 2
      selector:
        number:
          min: 0.01
          max: 100000
          step: any
          mode: box
clear:
  name: Clear
  description: Remove everything from the freezer inventory.
  fields:
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
add_to_shopping_list:
  name: Add to shopping list
  description: Add an item to the Home Assistant shopping list (requires the Shopping List integration).
  fields:
    name:
      name: Name
      description: Name of the item.
      required: true
      selector:
        text:

set_min_stock:
  name: Set minimum stock
  description: Set the minimum stock of an item. When stock falls to this level the item is added to the shopping list. Leave the minimum empty to clear it.
  fields:
    name:
      name: Name
      description: Name of the item.
      required: true
      example: Minced beef
      selector:
        text:
    min_stock:
      name: Minimum stock
      description: Minimum stock level. Leave empty to clear.
      selector:
        number:
          min: 0
          step: any
          mode: box
    min_unit:
      name: Counted in
      description: Count the minimum in packages or in total units (pieces per package).
      default: packages
      selector:
        select:
          options:
            - packages
            - units
    location:
      name: Location
      description: Freezer or fridge.
      default: freezer
      selector:
        select:
          options:
            - freezer
            - fridge
    appliance:
      name: Freezer or fridge name
      description: Name of an extra freezer or fridge added under Configure. Overrides location.
      selector:
        text:
